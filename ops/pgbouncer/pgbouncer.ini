[databases]
agenttrust = host=postgres port=5432 dbname=agenttrust

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /tmp/agenttrust-users.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
reserve_pool_size = 5
server_reset_query = DISCARD ALL
server_reset_query_always = 1
query_wait_timeout = 5
server_connect_timeout = 5
pidfile = /tmp/agenttrust-pgbouncer.pid
log_connections = 0
log_disconnections = 0
